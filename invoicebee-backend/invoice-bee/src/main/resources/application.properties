spring.application.name=invoice-bee

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR



spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model= qwen2.5:7b-instruct-q4_K_M

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:models/gemini-3.8-flash}

searxng.base-url=http://localhost:8085
ocr.service.url=http://127.0.0.1:8000/api/v1/ocr

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


